name: Uppdatera Discord-chatt

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta chatt
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python fetch_discord.py
      - name: Spara ändringar
        run: |
          git config user.name "chatt-bot"
          git config user.email "chatt-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara"
            exit 0
          fi
          git commit -m "Uppdatera chatt"
          git pull --rebase
          git push
